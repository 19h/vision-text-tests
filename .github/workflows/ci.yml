name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core xfonts-base
      - run: python -m pip install -r requirements.lock
      - run: python -m compileall -q .
      - run: python -m pytest
      - run: python validate_project.py --rebuild
      - run: python make_docs.py --check
